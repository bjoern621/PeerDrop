name: CD

on:
    release:
        types: [published]

permissions:
    contents: read
    packages: write

jobs:
    determine-image-tag:
        runs-on: ubuntu-latest
        name: Determine image tags
        outputs:
            TAGS: ${{ steps.set_tag.outputs.TAGS }}

        steps:
            - name: Validate tag
              run: |
                  tag="${{ github.event.release.tag_name }}"
                  if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-b[0-9]+)?$ ]]; then
                      echo "Invalid tag format. Expected: vX.X.X or vX.X.X-bN"
                      exit 1
                  fi
            
            - name: Set tags for Docker images
              id: set_tag
              run: |
                  tag="${{ github.event.release.tag_name }}"
                  version_without_v=${tag#"v"}
            
                  if [[ "$version_without_v" == *-b* ]]; then
                      echo "TAGS=${version_without_v}" >> "$GITHUB_OUTPUT"
                      echo "The image will have the tag: ${version_without_v}"
                  else
                      major_version=$(echo $version_without_v | cut -d. -f1)
                      minor_version=$(echo $version_without_v | cut -d. -f1,2)
                      echo "TAGS=${major_version},${minor_version},${version_without_v}" >> "$GITHUB_OUTPUT"
                      echo "The image will have the tags: ${major_version}, ${minor_version}, ${version_without_v}"
                  fi

    build-and-push-frontend:
        name: Build & Push Frontend
        needs: determine-image-tag
        uses: ./.github/workflows/docker-publish-frontend.yml
        with:
            tags: ${{ needs.determine-image-tag.outputs.TAGS }}

    build-and-push-backend:
        name: Build & Push Backend
        needs: determine-image-tag
        uses: ./.github/workflows/docker-publish-backend.yml
        with:
            tags: ${{ needs.determine-image-tag.outputs.TAGS }}

    build-and-push-database:
        name: Build & Push Database
        needs: determine-image-tag
        uses: ./.github/workflows/docker-publish-database.yml
        with:
            tags: ${{ needs.determine-image-tag.outputs.TAGS }}

    build-cli:
        name: Build & Upload CLI Binaries
        runs-on: ubuntu-latest
        needs: determine-image-tag
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: cli/go.mod

            - name: Build Binaries
              run: |
                  tag="${{ github.event.release.tag_name }}"
                  GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=${tag}" -o dist/peerdrop-linux-amd64 .
                  GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=${tag}" -o dist/peerdrop-windows-amd64.exe .
                  cd dist && sha256sum peerdrop-linux-amd64 peerdrop-windows-amd64.exe > SHA256SUMS
              working-directory: cli

            - name: Upload Release Assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                      dist/peerdrop-linux-amd64 \
                      dist/peerdrop-windows-amd64.exe \
                      dist/SHA256SUMS \
                      --clobber
              working-directory: cli

    deploy:
        name: Deploy to Production
        runs-on: ubuntu-latest
        # The bootstrap script of a deployed frontend points at the assets of
        # this release, so the upload comes first.
        needs:
            - build-and-push-frontend
            - build-and-push-backend
            - build-and-push-database
            - build-cli

        steps:
            - name: Trigger Watchtower Update
              run: |
                  curl -X POST \
                    -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
                    https://watchtower.bjoernblessin.de/peerdrop/v1/update
